<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan - Gleam Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/theme.js"></script>
    <style>body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}.fade-in{animation:fadeIn .5s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style>
</head>
<body class="flex">
    <div id="sidebar-container"></div>
    <main class="flex-1 p-8">
        <header class="mb-8 fade-in"><h1 class="text-3xl font-extrabold" style="color:var(--text)">Pesanan</h1><p style="color:var(--text-secondary)" class="mt-1 text-sm">Kelola semua pesanan</p></header>
        <div class="flex gap-2 mb-6 flex-wrap" id="statusTabs">
            <button onclick="filterOrders('all')" class="px-4 py-2 rounded-xl font-medium text-sm" style="background:var(--gold);color:white">Semua</button>
            <button onclick="filterOrders('pending')" class="px-4 py-2 rounded-xl font-medium text-sm" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border)">Pending</button>
            <button onclick="filterOrders('paid')" class="px-4 py-2 rounded-xl font-medium text-sm" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border)">Dibayar</button>
            <button onclick="filterOrders('processing')" class="px-4 py-2 rounded-xl font-medium text-sm" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border)">Diproses</button>
            <button onclick="filterOrders('completed')" class="px-4 py-2 rounded-xl font-medium text-sm" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border)">Selesai</button>
        </div>
        <div class="glass-card overflow-hidden fade-in">
            <table class="w-full text-left"><thead><tr class="text-sm border-b" style="background:var(--input-bg);border-color:var(--border)"><th class="p-4">Order ID</th><th class="p-4">Customer</th><th class="p-4">Total</th><th class="p-4">Status</th><th class="p-4">Tanggal</th><th class="p-4">Aksi</th></tr></thead><tbody id="ordersTable"><tr><td colspan="6" class="p-8 text-center" style="color:var(--text-secondary)">Loading...</td></tr></tbody></table>
        </div>
    </main>
    <script>
        const supabaseClient=window.supabase.createClient('https://ztrdiuvfczylzqsrrkhe.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0cmRpdXZmY3p5bHpxc3Jya2hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjU4OTQsImV4cCI6MjA5MzUwMTg5NH0.0roGvDQaWONGkPV1s-uRen2seoLdXkckHq03F6cQTyw');
        let currentFilter='all';
        document.addEventListener('DOMContentLoaded',async()=>{
            document.getElementById('sidebar-container').innerHTML=GleamTheme.renderSidebar('orders');
            GleamTheme.init();await GleamTheme.checkAuth();loadOrders();
        });
        async function loadOrders(){let q=supabaseClient.from('orders').select('*,profiles(full_name)').order('created_at',{ascending:false});if(currentFilter!=='all')q=q.eq('status',currentFilter);const{data}=await q;document.getElementById('ordersTable').innerHTML=data?.map(o=>`<tr class="border-b" style="border-color:var(--border)"><td class="p-4 font-mono text-sm" style="color:var(--gold)">#${o.order_number||o.id.substring(0,8)}</td><td class="p-4 text-sm" style="color:var(--text)">${o.profiles?.full_name||'-'}</td><td class="p-4 text-sm font-medium" style="color:var(--text)">${GleamTheme.formatPrice(o.total_price)}</td><td class="p-4">${GleamTheme.statusBadge(o.status)}</td><td class="p-4 text-sm" style="color:var(--text-secondary)">${GleamTheme.formatDate(o.created_at)}</td><td class="p-4"><select onchange="updateStatus('${o.id}',this.value)" class="text-xs rounded-lg px-2 py-1" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"><option value="">Ubah</option><option value="paid">Dibayar</option><option value="processing">Diproses</option><option value="shipped">Dikirim</option><option value="completed">Selesai</option></select></td></tr>`).join('')||'<tr><td colspan="6" class="p-8 text-center" style="color:var(--text-secondary)">Tidak ada pesanan</td></tr>'}
        function filterOrders(s){currentFilter=s;document.querySelectorAll('#statusTabs button').forEach(b=>{b.style.background='var(--card-bg)';b.style.color='var(--text)';b.style.border='1px solid var(--border)'});const btn=document.querySelector(`[onclick="filterOrders('${s}')"]`);if(btn){btn.style.background='var(--gold)';btn.style.color='white';btn.style.border='none'}loadOrders()}
        async function updateStatus(id,s){if(!s)return;await supabaseClient.from('orders').update({status:s,updated_at:new Date()}).eq('id',id);loadOrders()}
    </script>
</body>
</html>
