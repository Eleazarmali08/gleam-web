<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gleam Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#FBBF24', 500: '#D4AF37', 600: '#B8960C' },
                        luxury: { dark: '#111111', surface: '#1E1E1E', light: '#F8F9FA' }
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/theme.js"></script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; }
        .stat-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(212, 175, 55, 0.1); color: #D4AF37; }
    </style>
</head>
<body class="flex">
    <div id="sidebar-container"></div>
    <main class="flex-1 p-8" role="main">
        <header class="flex justify-between items-center mb-8 fade-in">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight" style="color: var(--text);">Dashboard</h1>
                <p style="color: var(--text-secondary);" class="mt-1 text-sm"><time id="currentDate">Selamat datang kembali, Admin</time></p>
            </div>
            <a href="products.html" class="btn-gold px-5 py-3 rounded-xl font-semibold flex items-center gap-2 text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                Tambah Produk
            </a>
        </header>
        <section class="mb-8">
            <h2 class="sr-only">Statistik Utama</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="glass-stat-card stat-card fade-in" style="animation-delay:0.1s">
                    <div class="flex items-center justify-between mb-3"><span class="text-sm font-medium" style="color:var(--text-secondary)">Total Revenue</span><div class="stat-icon"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div></div>
                    <dd class="text-2xl font-bold" style="color:var(--text)" id="totalRevenue">Rp 0</dd>
                    <dd class="text-green-500 text-sm mt-2 flex items-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.293 9.707a1 1 0 010-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L11 7.414V15a1 1 0 11-2 0V7.414L6.707 9.707a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>Bulan ini</dd>
                </div>
                <div class="glass-stat-card stat-card fade-in" style="animation-delay:0.2s">
                    <div class="flex items-center justify-between mb-3"><span class="text-sm font-medium" style="color:var(--text-secondary)">Total Pesanan</span><div class="stat-icon"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg></div></div>
                    <dd class="text-2xl font-bold" style="color:var(--text)" id="totalOrders">0</dd>
                    <dd class="text-sm mt-2" style="color:var(--text-secondary)">Semua status</dd>
                </div>
                <div class="glass-stat-card stat-card fade-in" style="animation-delay:0.3s">
                    <div class="flex items-center justify-between mb-3"><span class="text-sm font-medium" style="color:var(--text-secondary)">Produk Aktif</span><div class="stat-icon"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg></div></div>
                    <dd class="text-2xl font-bold" style="color:var(--text)" id="totalProducts">0</dd>
                    <dd class="text-sm mt-2" style="color:var(--text-secondary)">Tersedia</dd>
                </div>
                <div class="glass-stat-card stat-card fade-in" style="animation-delay:0.4s">
                    <div class="flex items-center justify-between mb-3"><span class="text-sm font-medium" style="color:var(--text-secondary)">Pending</span><div class="stat-icon" style="background:rgba(245,158,11,0.1);color:#F59E0B"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div></div>
                    <dd class="text-2xl font-bold" style="color:#F59E0B" id="pendingOrders">0</dd>
                    <dd class="text-sm mt-2" style="color:var(--text-secondary)">Butuh aksi</dd>
                </div>
            </div>
        </section>
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <article class="glass-card p-6 fade-in" style="animation-delay:0.5s">
                <h3 class="font-semibold text-lg mb-4 flex items-center gap-2" style="color:var(--text)"><svg class="w-5 h-5" style="color:#D4AF37" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>Revenue 7 Hari</h3>
                <canvas id="revenueChart" height="200"></canvas>
            </article>
            <article class="glass-card p-6 fade-in" style="animation-delay:0.6s">
                <h3 class="font-semibold text-lg mb-4 flex items-center gap-2" style="color:var(--text)"><svg class="w-5 h-5" style="color:#D4AF37" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055zM20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>Status Pesanan</h3>
                <canvas id="orderStatusChart" height="200"></canvas>
            </article>
        </section>
        <section class="fade-in" style="animation-delay:0.7s">
            <div class="glass-card p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-semibold text-lg flex items-center gap-2" style="color:var(--text)"><svg class="w-5 h-5" style="color:#D4AF37" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>Pesanan Terbaru</h3>
                    <a href="orders.html" class="text-sm font-medium" style="color:var(--gold)">Lihat Semua →</a>
                </div>
                <table class="w-full text-left"><thead><tr class="text-sm border-b" style="border-color:var(--border)"><th class="pb-3">Order ID</th><th class="pb-3">Customer</th><th class="pb-3">Total</th><th class="pb-3">Status</th><th class="pb-3">Tanggal</th><th class="pb-3">Aksi</th></tr></thead><tbody id="recentOrders"></tbody></table>
            </div>
        </section>
    </main>
    <script>
        const supabaseClient = window.supabase.createClient('https://ztrdiuvfczylzqsrrkhe.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0cmRpdXZmY3p5bHpxc3Jya2hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjU4OTQsImV4cCI6MjA5MzUwMTg5NH0.0roGvDQaWONGkPV1s-uRen2seoLdXkckHq03F6cQTyw');
        document.addEventListener('DOMContentLoaded',async()=>{
            document.getElementById('sidebar-container').innerHTML = GleamTheme.renderSidebar('dashboard');
            GleamTheme.init();
            await GleamTheme.checkAuth();
            document.getElementById('currentDate').textContent = 'Selamat datang kembali, Admin • ' + GleamTheme.formatDate(new Date());
            await loadDashboard();
        });

        async function loadDashboard(){
            // Destroy all existing charts before loading new data
            GleamTheme.destroyCharts();

            const { data: orders, error: ordersError } = await supabaseClient
                .from('orders')
                .select('*, profiles(full_name,email)')
                .order('created_at', { ascending: false })
                .limit(50);

            if (ordersError) {
                console.error('Failed to load orders:', ordersError);
            }

            const { count: productCount } = await supabaseClient
                .from('products')
                .select('id', { count: 'exact', head: true })
                .eq('is_active', true);

            const safeOrders = Array.isArray(orders) ? orders : [];
            const totalRevenue = safeOrders.reduce((sum, order) => sum + (Number(order.total_price) || 0), 0);
            const pendingCount = safeOrders.filter(order => order.status === 'pending').length;
            const totalOrders = safeOrders.length;

            document.getElementById('totalRevenue').textContent = GleamTheme.formatPrice(totalRevenue);
            document.getElementById('totalOrders').textContent = totalOrders.toLocaleString('id-ID');
            document.getElementById('totalProducts').textContent = (productCount || 0).toLocaleString('id-ID');
            document.getElementById('pendingOrders').textContent = pendingCount.toLocaleString('id-ID');

            const { labels, data } = getLast7DaysRevenue(safeOrders);

            // Charts render directly — DOM is already ready inside DOMContentLoaded
            if (document.getElementById('revenueChart')) {
                GleamTheme.lineChart('revenueChart', labels, data);
            }

            if (document.getElementById('orderStatusChart')) {
                const statusCounts = safeOrders.reduce((acc, order) => {
                    acc[order.status] = (acc[order.status] || 0) + 1;
                    return acc;
                }, {});

                GleamTheme.doughnutChart('orderStatusChart', ['Pending', 'Dibayar', 'Diproses', 'Selesai'], [
                    statusCounts.pending || 0,
                    statusCounts.paid || 0,
                    statusCounts.processing || 0,
                    statusCounts.completed || 0,
                ]);
            }

            const recentOrders = safeOrders.slice(0, 5);
            document.getElementById('recentOrders').innerHTML = recentOrders.map(order => `
                <tr class="border-b" style="border-color:var(--border)">
                    <td class="py-3 font-mono text-sm" style="color:var(--gold)">#${order.order_number || (order.id || '').substring(0, 8)}</td>
                    <td class="py-3 text-sm">
                        <div style="color:var(--text)">${order.profiles?.full_name || '-'}</div>
                        <div class="text-xs" style="color:var(--text-secondary)">${order.profiles?.email || ''}</div>
                    </td>
                    <td class="py-3 text-sm font-medium" style="color:var(--text)">${GleamTheme.formatPrice(order.total_price)}</td>
                    <td class="py-3">${GleamTheme.statusBadge(order.status)}</td>
                    <td class="py-3 text-sm" style="color:var(--text-secondary)">${GleamTheme.formatDate(order.created_at)}</td>
                    <td class="py-3"><a href="orders.html?id=${order.id}" class="text-sm font-medium" style="color:var(--gold)">Detail →</a></td>
                </tr>
            `).join('') || '<tr><td colspan="6" class="py-8 text-center" style="color:var(--text-secondary)">Belum ada pesanan</td></tr>';
        }

        function getLast7DaysRevenue(orders){
            const revenueByDay = {};
            const labels = [];

            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const key = date.toISOString().split('T')[0];
                labels.push(date.toLocaleDateString('id-ID', { weekday: 'short' }));
                revenueByDay[key] = 0;
            }

            orders.forEach(order => {
                const key = new Date(order.created_at).toISOString().split('T')[0];
                if (revenueByDay.hasOwnProperty(key)) {
                    revenueByDay[key] += Number(order.total_price) || 0;
                }
            });

            return {
                labels,
                data: Object.values(revenueByDay),
            };
        }
    </script>
</body>
</html>
