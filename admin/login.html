<!DOCTYPE html>
<html lang="id" itemscope itemtype="https://schema.org/WebApplication">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Login Gleam - Panel administrasi toko emas & perhiasan">
    <meta name="robots" content="noindex, nofollow">
    
    <title>Admin Login - Gleam Jewelry</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#FBBF24', 500: '#D4AF37', 600: '#B8960C' },
                        luxury: { dark: '#0D0D0D' }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { font-family: 'Inter', system-ui, sans-serif; }
        
        body { 
            position: relative;
            background-color: #0D0D0D;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Liquid Glass Layout */
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(180deg, rgba(13, 13, 13, 0.6) 0%, #0D0D0D 100%), url('https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=1200');
            background-size: cover;
            background-position: center;
            filter: contrast(110%) brightness(80%);
            z-index: -2;
        }

        /* Ornamen Cahaya Cair Tambahan di Belakang Kartu */
        .liquid-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }
        
        /* Advanced Liquid Glassmorphism Card Style */
        .glass { 
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(25px) saturate(160%); 
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            /* Refleksi tepi kaca yang glossy */
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 24px;
            /* Efek bayangan kaca berlapis */
            box-shadow: 
                0 4px 30px rgba(0, 0, 0, 0.4),
                inset 0 1px 2px rgba(255, 255, 255, 0.15),
                inset 0 -10px 20px rgba(255, 255, 255, 0.02);
        }

        /* Input Glassmorphism */
        .glass-input {
            background: rgba(0, 0, 0, 0.35) !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-input:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.5) !important;
            border-color: rgba(212, 175, 55, 0.6) !important;
            box-shadow: 
                0 0 0 3px rgba(212, 175, 55, 0.15),
                inset 0 1px 2px rgba(212, 175, 55, 0.2);
        }
        
        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        
        .btn-gold {
            background: linear-gradient(135deg, #E5C100, #B8960C);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-gold:hover {
            background: linear-gradient(135deg, #FBBF24, #D4AF37);
            box-shadow: 0 12px 28px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }
        
        .btn-gold:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2);
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-6">

    <div class="liquid-bg"></div>
    <div class="liquid-glow"></div>
    
    <main role="main" class="w-full max-w-md z-10">
        
        <section class="glass p-8 md:p-10 fade-in" aria-labelledby="login-heading" role="form" aria-label="Form login admin">
            
            <header class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-white/10 to-white/0 border border-white/20 mb-4 shadow-inner">
                    <span class="text-3xl">💎</span>
                </div>
                <h1 id="login-heading" class="text-3xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-gold-500 to-amber-600">
                    GLEAM
                </h1>
                <p class="text-gray-400/90 text-sm font-medium tracking-wider uppercase mt-1.5">Admin Panel</p>
            </header>
            
            <form id="loginForm" class="space-y-6" novalidate>
                
                <div>
                    <label for="email" class="block text-gray-300 text-sm font-medium mb-2 tracking-wide">
                        Email Kantor
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        required 
                        autocomplete="email"
                        aria-required="true"
                        aria-label="Alamat email"
                        placeholder="admin@gleam.com"
                        class="glass-input w-full px-4 py-3.5 rounded-xl text-white placeholder-gray-500/80 transition">
                </div>
                
                <div>
                    <label for="password" class="block text-gray-300 text-sm font-medium mb-2 tracking-wide">
                        Kata Sandi
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        required 
                        autocomplete="current-password"
                        aria-required="true"
                        aria-label="Kata sandi"
                        placeholder="••••••••"
                        minlength="6"
                        class="glass-input w-full px-4 py-3.5 rounded-xl text-white placeholder-gray-500/80 transition">
                </div>
                
                <button 
                    type="submit" 
                    id="loginButton"
                    aria-label="Masuk ke panel admin"
                    class="btn-gold w-full text-neutral-950 py-3.5 rounded-xl font-bold text-base tracking-wide focus:outline-none mt-2">
                    <span id="buttonText">Masuk Ke Sistem</span>
                </button>
                
                <div id="error" class="text-red-400 text-center text-sm font-medium bg-red-500/10 border border-red-500/20 py-2.5 rounded-lg hidden" role="alert" aria-live="polite" aria-atomic="true"></div>
                
                <div id="success" class="text-green-400 text-center text-sm font-medium bg-green-500/10 border border-green-500/20 py-2.5 rounded-lg hidden" role="status" aria-live="polite"></div>
                
            </form>
            
            <nav class="text-center mt-8 border-t border-white/5 pt-4" aria-label="Navigasi">
                <a href="/" class="text-gray-400 hover:text-gold-500 transition-colors text-sm font-medium inline-flex items-center gap-1">
                    <span>←</span> Kembali ke Beranda
                </a>
            </nav>
        </section>
        
        <footer class="text-center mt-8 text-gray-500/70 text-xs tracking-wide">
            <p>&copy; 2026 Gleam Jewelry. All rights reserved.</p>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ============================================
        // SUPABASE CONFIG - MENGGUNAKAN URL PROYEK ANDA
        // ============================================
        const SUPABASE_URL = 'https://ztrdiuvfczylzqsrrkhe.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY'; // ← Tempel 'Publishable key' Supabase Anda di sini!
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // ============================================
        // DEBUG MODE
        // ============================================
        const DEBUG = true;
        function log(...args) {
            if (DEBUG) console.log(...args);
        }
        
        // ============================================
        // LOGIN HANDLER
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            const buttonText = document.getElementById('buttonText');
            const loginButton = document.getElementById('loginButton');
            
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');
            
            if (!email || !password) {
                errorEl.textContent = '⚠️ Email dan password harus diisi!';
                errorEl.classList.remove('hidden');
                return;
            }
            
            if (password.length < 6) {
                errorEl.textContent = '⚠️ Password minimal 6 karakter!';
                errorEl.classList.remove('hidden');
                return;
            }
            
            loginButton.disabled = true;
            buttonText.innerHTML = '<span class="spinner"></span> Memvalidasi...';
            
            log('🔐 Login attempt:', email);
            
            try {
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (authError) {
                    log('❌ Auth error:', authError);
                    throw new Error(authError.message);
                }
                
                if (!authData?.user) {
                    throw new Error('User tidak ditemukan');
                }
                
                log('✅ Login berhasil, user ID:', authData.user.id);
                
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role, full_name')
                    .eq('id', authData.user.id)
                    .single();
                
                if (profileError) {
                    log('❌ Profile error:', profileError);
                    
                    const { error: insertError } = await supabase
                        .from('profiles')
                        .insert({
                            id: authData.user.id,
                            full_name: authData.user.user_metadata?.full_name || 'Admin',
                            email: email,
                            role: 'customer'
                        });
                    
                    if (insertError) {
                        log('❌ Insert profile error:', insertError);
                        await supabase.auth.signOut();
                        throw new Error('Profil tidak ditemukan. Hubungi administrator.');
                    }
                    
                    const { data: newProfile } = await supabase
                        .from('profiles')
                        .select('role')
                        .eq('id', authData.user.id)
                        .single();
                    
                    if (!newProfile || newProfile.role !== 'admin') {
                        await supabase.auth.signOut();
                        throw new Error('Akun Anda bukan admin. Akses ditolak.');
                    }
                }
                
                log('👤 Profile:', profile);
                
                if (!profile || profile.role !== 'admin') {
                    await supabase.auth.signOut();
                    throw new Error('Akses ditolak. Anda bukan admin. Hubungi administrator.');
                }
                
                log('✅ Admin confirmed! Redirecting...');
                
                successEl.textContent = '✅ Login berhasil! Mengalihkan...';
                successEl.classList.remove('hidden');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
                
            } catch (err) {
                log('❌ Error:', err.message);
                errorEl.textContent = '❌ ' + err.message;
                errorEl.classList.remove('hidden');
                
                loginButton.disabled = false;
                buttonText.textContent = 'Masuk Ke Sistem';
            }
        });
        
        // ============================================
        // CEK APAKAH SUDAH LOGIN
        // ============================================
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                log('🔍 Session found, checking role...');
                
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .single();
                
                if (profile?.role === 'admin') {
                    log('✅ Already logged in as admin, redirecting...');
                    window.location.href = 'dashboard.html';
                }
            }
        }
        
        checkSession();
        
        // ============================================
        // ENTER KEY TO SUBMIT
        // ============================================
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.activeElement?.tagName === 'INPUT') {
                document.getElementById('loginForm').requestSubmit();
            }
        });
    </script>
</body>
</html>
