<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - Gleam Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/theme.js"></script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="flex">
    <div id="sidebar-container"></div>
    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8 fade-in">
            <div><h1 class="text-3xl font-extrabold" style="color:var(--text)">Produk</h1><p style="color:var(--text-secondary)" class="mt-1 text-sm">Kelola semua produk</p></div>
            <button onclick="openModal()" class="btn-gold px-5 py-3 rounded-xl font-semibold text-sm">➕ Tambah Produk</button>
        </header>
        <div class="glass-card p-4 mb-6 flex gap-4 fade-in">
            <input type="text" id="searchInput" placeholder="🔍 Cari produk..." class="flex-1 px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)" oninput="loadProducts()">
            <select id="categoryFilter" onchange="loadProducts()" class="px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"><option value="">Semua Kategori</option></select>
        </div>
        <div class="glass-card overflow-hidden fade-in">
            <table class="w-full text-left"><thead><tr class="text-sm border-b bg-opacity-50" style="background:var(--input-bg);border-color:var(--border)"><th class="p-4">Produk</th><th class="p-4">Kategori</th><th class="p-4">Harga</th><th class="p-4">Stok</th><th class="p-4">Status</th><th class="p-4">Aksi</th></tr></thead><tbody id="productsTable"><tr><td colspan="6" class="p-8 text-center" style="color:var(--text-secondary)">Loading...</td></tr></tbody></table>
        </div>
    </main>
    <div id="productModal" class="modal"><div class="glass-card p-8 w-full max-w-2xl max-h-[90vh] overflow-y-auto" style="margin:20px"><div class="flex justify-between items-center mb-6"><h2 id="modalTitle" class="text-xl font-bold" style="color:var(--text)">Tambah Produk</h2><button onclick="closeModal()" class="text-2xl" style="color:var(--text-secondary)">&times;</button></div><form id="productForm" class="space-y-4"><input type="hidden" id="productId"><div class="grid grid-cols-2 gap-4"><div class="col-span-2"><label class="block text-sm mb-1" style="color:var(--text-secondary)">Nama</label><input type="text" id="productName" required class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"></div><div><label class="block text-sm mb-1" style="color:var(--text-secondary)">Harga (Rp)</label><input type="number" id="productPrice" required class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"></div><div><label class="block text-sm mb-1" style="color:var(--text-secondary)">Berat (g)</label><input type="number" id="productWeight" step="0.1" required class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"></div><div><label class="block text-sm mb-1" style="color:var(--text-secondary)">Karat</label><select id="productKarat" class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"><option value="18K">18K</option><option value="22K">22K</option><option value="24K">24K</option></select></div><div><label class="block text-sm mb-1" style="color:var(--text-secondary)">Stok</label><input type="number" id="productStock" required class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"></div><div><label class="block text-sm mb-1" style="color:var(--text-secondary)">Kategori</label><select id="productCategory" class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"></select></div><div class="col-span-2"><label class="block text-sm mb-1" style="color:var(--text-secondary)">Deskripsi</label><textarea id="productDesc" rows="3" class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"></textarea></div></div><div class="flex gap-3 justify-end mt-6"><button type="button" onclick="closeModal()" class="px-6 py-2 rounded-xl text-sm" style="border:1px solid var(--border);color:var(--text)">Batal</button><button type="submit" class="btn-gold px-6 py-2 rounded-xl text-sm font-semibold">Simpan</button></div></form></div></div>
    <script>
        const supabaseClient = window.supabase.createClient('https://ztrdiuvfczylzqsrrkhe.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0cmRpdXZmY3p5bHpxc3Jya2hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjU4OTQsImV4cCI6MjA5MzUwMTg5NH0.0roGvDQaWONGkPV1s-uRen2seoLdXkckHq03F6cQTyw');
        document.addEventListener('DOMContentLoaded',async()=>{
            document.getElementById('sidebar-container').innerHTML=GleamTheme.renderSidebar('products');
            GleamTheme.init();await GleamTheme.checkAuth();
            loadCategories();loadProducts();
        });
        async function loadCategories(){const{data}=await supabaseClient.from('categories').select('*');const s=document.getElementById('productCategory');const f=document.getElementById('categoryFilter');const opt=data?.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')||'';s.innerHTML=opt;f.innerHTML='<option value="">Semua Kategori</option>'+opt}
        async function loadProducts(){const s=document.getElementById('searchInput').value;const c=document.getElementById('categoryFilter').value;let q=supabaseClient.from('products').select('*,categories(name),product_images(image_url,is_primary)').order('created_at',{ascending:false});if(s)q=q.ilike('name',`%${s}%`);if(c)q=q.eq('category_id',c);const{data}=await q;document.getElementById('productsTable').innerHTML=data?.map(p=>`<tr class="border-b" style="border-color:var(--border)"><td class="p-4"><div class="flex items-center gap-3"><img src="${p.product_images?.find(i=>i.is_primary)?.image_url||p.product_images?.[0]?.image_url||'https://placehold.co/48/D4AF37/white?text=G'}" class="w-10 h-10 rounded-lg object-cover" onerror="this.src='https://placehold.co/48/D4AF37/white?text=G'"><div><div class="font-medium" style="color:var(--text)">${p.name}</div><div class="text-xs" style="color:var(--text-secondary)">${p.karat} • ${p.weight}g</div></div></div></td><td class="p-4 text-sm" style="color:var(--text-secondary)">${p.categories?.name||'-'}</td><td class="p-4 text-sm font-medium" style="color:var(--text)">${GleamTheme.formatPrice(p.price)}</td><td class="p-4 text-sm" style="color:var(--text)">${p.stock}</td><td class="p-4"><span class="px-2 py-1 rounded-full text-xs font-semibold" style="background:${p.is_active?'rgba(16,185,129,0.15)':'rgba(239,68,68,0.15)'};color:${p.is_active?'#10B981':'#EF4444'}">${p.is_active?'Aktif':'Nonaktif'}</span></td><td class="p-4"><div class="flex gap-2"><button onclick="editProduct('${p.id}')" class="text-blue-500">✏️</button><button onclick="deleteProduct('${p.id}')" class="text-red-500">🗑️</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="p-8 text-center" style="color:var(--text-secondary)">Tidak ada produk</td></tr>'}
        function openModal(){document.getElementById('modalTitle').textContent='Tambah Produk';document.getElementById('productId').value='';document.getElementById('productForm').reset();document.getElementById('productModal').classList.add('active')}
        function closeModal(){document.getElementById('productModal').classList.remove('active')}
        async function editProduct(id){const{data}=await supabaseClient.from('products').select('*').eq('id',id).single();if(!data)return;document.getElementById('modalTitle').textContent='Edit Produk';document.getElementById('productId').value=data.id;document.getElementById('productName').value=data.name;document.getElementById('productPrice').value=data.price;document.getElementById('productWeight').value=data.weight;document.getElementById('productKarat').value=data.karat;document.getElementById('productStock').value=data.stock;document.getElementById('productCategory').value=data.category_id||'';document.getElementById('productDesc').value=data.description||'';document.getElementById('productModal').classList.add('active')}
        document.getElementById('productForm').addEventListener('submit',async(e)=>{e.preventDefault();const id=document.getElementById('productId').value;const d={name:document.getElementById('productName').value,price:parseFloat(document.getElementById('productPrice').value),weight:parseFloat(document.getElementById('productWeight').value),karat:document.getElementById('productKarat').value,stock:parseInt(document.getElementById('productStock').value),category_id:document.getElementById('productCategory').value||null,description:document.getElementById('productDesc').value};if(id){await supabaseClient.from('products').update(d).eq('id',id)}else{d.slug=d.name.toLowerCase().replace(/\s+/g,'-');await supabaseClient.from('products').insert(d)}closeModal();loadProducts()});
        async function deleteProduct(id){if(confirm('Hapus produk?')){await supabaseClient.from('product_images').delete().eq('product_id',id);await supabaseClient.from('products').delete().eq('id',id);loadProducts()}}
    </script>
</body>
</html>
