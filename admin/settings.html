<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - Gleam Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/theme.js"></script>
    <style>body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}.fade-in{animation:fadeIn .5s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.tab-btn{padding:8px 20px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}.tab-btn.active{background:var(--gold);color:white}.tab-btn:not(.active){background:var(--card-bg);color:var(--text-secondary);border:1px solid var(--border)}.tab-content{display:none}.tab-content.active{display:block}</style>
</head>
<body class="flex">
    <div id="sidebar-container"></div>
    <main class="flex-1 p-8">
        <header class="mb-8 fade-in"><h1 class="text-3xl font-extrabold" style="color:var(--text)">Pengaturan</h1><p style="color:var(--text-secondary)" class="mt-1 text-sm">Kelola pengaturan toko</p></header>
        <div class="flex gap-2 mb-6">
            <button class="tab-btn active" onclick="switchTab('bank')">
                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Rekening Bank
            </button>
            <button class="tab-btn" onclick="switchTab('password')">
                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Ubah Password
            </button>
        </div>
        <div id="bankTab" class="tab-content active fade-in">
            <div class="glass-card p-6"><div class="flex justify-between items-center mb-6"><h3 class="text-lg font-semibold" style="color:var(--text)">Rekening Bank</h3><button onclick="openBankModal()" class="btn-gold px-4 py-2 rounded-xl text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                <span class="ml-2">Tambah</span>
            </button></div><div id="bankList" class="space-y-3"></div></div>
        </div>
        <div id="passwordTab" class="tab-content fade-in">
            <div class="glass-card p-6 max-w-md"><h3 class="text-lg font-semibold mb-4" style="color:var(--text)">Ubah Password</h3><form id="passwordForm" class="space-y-4"><input type="password" id="newPassword" placeholder="Password baru" required minlength="6" class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"><input type="password" id="confirmPassword" placeholder="Konfirmasi password" required minlength="6" class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"><button type="submit" class="btn-gold px-6 py-2 rounded-xl text-sm font-semibold">Update</button></form><div id="passwordMsg" class="mt-4 text-sm"></div></div>
        </div>
    </main>
    <div id="bankModal" class="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;align-items:center;justify-content:center"><div class="glass-card p-6 w-full max-w-md"><div class="flex justify-between items-center mb-4"><h3 class="text-lg font-semibold" style="color:var(--text)">Tambah Rekening</h3><button onclick="closeBankModal()" class="text-2xl" style="color:var(--text-secondary)"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg></button></div><form id="bankForm" class="space-y-4"><input type="hidden" id="bankId"><select id="bankName" class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"><option value="">Pilih Bank</option><option>BCA</option><option>Mandiri</option><option>BNI</option><option>BRI</option><option>BSI</option></select><input type="text" id="bankNumber" placeholder="Nomor Rekening" required class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"><input type="text" id="bankHolder" placeholder="Nama Pemilik" required class="w-full px-4 py-2 rounded-xl text-sm" style="background:var(--input-bg);color:var(--text);border:1px solid var(--border)"><div class="flex gap-3 justify-end"><button type="button" onclick="closeBankModal()" class="px-4 py-2 rounded-xl text-sm" style="border:1px solid var(--border);color:var(--text)">Batal</button><button type="submit" class="btn-gold px-4 py-2 rounded-xl text-sm">Simpan</button></div></form></div></div>
    <script>
        const supabaseClient = window.supabase.createClient('https://ztrdiuvfczylzqsrrkhe.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0cmRpdXZmY3p5bHpxc3Jya2hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjU4OTQsImV4cCI6MjA5MzUwMTg5NH0.0roGvDQaWONGkPV1s-uRen2seoLdXkckHq03F6cQTyw');

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('sidebar-container').innerHTML = GleamTheme.renderSidebar('settings');
            GleamTheme.init();
            await GleamTheme.checkAuth();
            await loadBanks();
        });

        function switchTab(tabName){
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }

        async function loadBanks(){
            const { data } = await supabaseClient
                .from('payment_accounts')
                .select('*')
                .order('display_order');

            document.getElementById('bankList').innerHTML = (data?.map(bank => `
                <div class="flex items-center justify-between p-4 rounded-xl" style="background:var(--input-bg)">
                    <div>
                        <div class="font-semibold" style="color:var(--text)">${bank.bank_name}</div>
                        <div class="text-sm font-mono" style="color:var(--text-secondary)">${bank.account_number}</div>
                        <div class="text-xs" style="color:var(--text-secondary)">a/n ${bank.account_holder}</div>
                    </div>
                    <div class="flex gap-2 items-center">
                        <span class="text-xs px-2 py-1 rounded-full" style="background:${bank.is_active?'rgba(16,185,129,0.15)':'rgba(239,68,68,0.15)'};color:${bank.is_active?'#10B981':'#EF4444'}">${bank.is_active?'Aktif':'Nonaktif'}</span>
                        <button onclick="editBank('${bank.id}')" class="p-2 rounded-md hover:bg-gray-100" title="Edit">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M9 11l6-6 3 3L12 14H9v-3z"></path></svg>
                        </button>
                        <button onclick="deleteBank('${bank.id}')" class="p-2 rounded-md hover:bg-gray-100" title="Hapus">
                            <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-1 12a2 2 0 01-2 2H8a2 2 0 01-2-2L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"></path></svg>
                        </button>
                    </div>
                </div>
            `).join('')) || '<p class="text-center py-8" style="color:var(--text-secondary)">Belum ada rekening</p>';
        }

        function openBankModal(){
            document.getElementById('bankId').value = '';
            document.getElementById('bankForm').reset();
            document.querySelector('#bankModal h3').textContent = 'Tambah Rekening';
            document.getElementById('bankModal').style.display = 'flex';
        }

        function closeBankModal(){
            document.getElementById('bankModal').style.display = 'none';
        }

        async function editBank(id){
            const { data } = await supabaseClient
                .from('payment_accounts')
                .select('*')
                .eq('id', id)
                .single();

            if (!data) return;

            document.getElementById('bankId').value = data.id;
            document.getElementById('bankName').value = data.bank_name;
            document.getElementById('bankNumber').value = data.account_number;
            document.getElementById('bankHolder').value = data.account_holder;
            document.querySelector('#bankModal h3').textContent = 'Edit Rekening';
            document.getElementById('bankModal').style.display = 'flex';
        }

        document.getElementById('bankForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('bankId').value;
            const bankName = document.getElementById('bankName').value;
            if (!bankName) { alert('Pilih bank terlebih dahulu'); return; }
            const payload = {
                bank_name: bankName,
                account_number: document.getElementById('bankNumber').value,
                account_holder: document.getElementById('bankHolder').value,
                is_active: true
            };

            let error;
            if (id) {
                ({ error } = await supabaseClient.from('payment_accounts').update(payload).eq('id', id));
            } else {
                ({ error } = await supabaseClient.from('payment_accounts').insert(payload));
            }

            if (error) {
                alert('Gagal menyimpan: ' + error.message);
                return;
            }

            closeBankModal();
            await loadBanks();
        });

        async function deleteBank(id){
            if (!confirm('Hapus rekening?')) return;
            const { error } = await supabaseClient.from('payment_accounts').delete().eq('id', id);
            if (error) {
                alert('Gagal menghapus: ' + error.message);
                return;
            }
            await loadBanks();
        }

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const msgEl = document.getElementById('passwordMsg');

            if (newPass !== confirmPass) {
                msgEl.textContent = 'Password tidak cocok!';
                msgEl.style.color = '#EF4444';
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({ password: newPass });

            if (error) {
                msgEl.textContent = 'Gagal: ' + error.message;
                msgEl.style.color = '#EF4444';
            } else {
                msgEl.textContent = 'Password berhasil diubah!';
                msgEl.style.color = '#10B981';
                document.getElementById('passwordForm').reset();
            }
        });
    </script>
</body>
</html>
