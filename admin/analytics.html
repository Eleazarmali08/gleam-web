<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analitik - Gleam Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/theme.js"></script>
    <style>body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}.fade-in{animation:fadeIn .5s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style>
</head>
<body class="flex">
    <div id="sidebar-container"></div>
    <main class="flex-1 p-8">
        <header class="mb-8 fade-in"><h1 class="text-3xl font-extrabold" style="color:var(--text)">Analitik</h1><p style="color:var(--text-secondary)" class="mt-1 text-sm">Visualisasi data penjualan</p></header>
        <div class="grid grid-cols-2 gap-6 mb-8 fade-in">
            <div class="glass-card p-6"><h3 class="font-semibold text-lg mb-4" style="color:var(--text)">Revenue Trend</h3><canvas id="revenueTrend" height="250"></canvas></div>
            <div class="glass-card p-6"><h3 class="font-semibold text-lg mb-4" style="color:var(--text)">Top Products</h3><canvas id="topProducts" height="250"></canvas></div>
        </div>
        <div class="grid grid-cols-4 gap-6 fade-in">
            <div class="glass-stat-card text-center"><div class="text-3xl font-bold" style="color:var(--gold)" id="avgOrder">Rp 0</div><div class="text-sm mt-2" style="color:var(--text-secondary)">Rata-rata Pesanan</div></div>
            <div class="glass-stat-card text-center"><div class="text-3xl font-bold" style="color:var(--gold)" id="totalCust">0</div><div class="text-sm mt-2" style="color:var(--text-secondary)">Pelanggan</div></div>
            <div class="glass-stat-card text-center"><div class="text-3xl font-bold" style="color:var(--gold)" id="convRate">0%</div><div class="text-sm mt-2" style="color:var(--text-secondary)">Konversi</div></div>
            <div class="glass-stat-card text-center"><div class="text-3xl font-bold" style="color:var(--gold)" id="bestDay">-</div><div class="text-sm mt-2" style="color:var(--text-secondary)">Hari Terbaik</div></div>
        </div>
    </main>
    <script>
        const supabaseClient=window.supabase.createClient('https://ztrdiuvfczylzqsrrkhe.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0cmRpdXZmY3p5bHpxc3Jya2hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjU4OTQsImV4cCI6MjA5MzUwMTg5NH0.0roGvDQaWONGkPV1s-uRen2seoLdXkckHq03F6cQTyw');
        document.addEventListener('DOMContentLoaded',async()=>{
            document.getElementById('sidebar-container').innerHTML=GleamTheme.renderSidebar('analytics');
            GleamTheme.init();await GleamTheme.checkAuth();loadAnalytics();
        });
        async function loadAnalytics(){
            const{data:orders}=await supabaseClient.from('orders').select('*,order_items(*)').order('created_at',{ascending:true});
            const{data:products}=await supabaseClient.from('products').select('*,categories(name)');
            const{count:custCount}=await supabaseClient.from('profiles').select('*',{count:'exact'}).eq('role','customer');
            const daily={};const labels=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);labels.push(d.toLocaleDateString('id-ID',{weekday:'short'}));daily[d.toISOString().split('T')[0]]=0}
            orders?.forEach(o=>{const ds=new Date(o.created_at).toISOString().split('T')[0];if(daily.hasOwnProperty(ds))daily[ds]+=(o.total_price||0)});
            GleamTheme.lineChart('revenueTrend',labels,Object.values(daily));
            const ps={};orders?.forEach(o=>{o.order_items?.forEach(i=>{ps[i.product_name]=ps[i.product_name]||0+i.quantity})});const tp=Object.entries(ps).sort((a,b)=>b[1]-a[1]).slice(0,5);
            new Chart(document.getElementById('topProducts'),{type:'bar',data:{labels:tp.map(p=>p[0].substring(0,20)),datasets:[{label:'Terjual',data:tp.map(p=>p[1]),backgroundColor:'#D4AF37',borderRadius:8}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}}}});
            const totalRevenue=orders?.reduce((s,o)=>s+(o.total_price||0),0)||0;const totalOrders=orders?.length||0;
            document.getElementById('avgOrder').textContent=GleamTheme.formatPrice(totalOrders>0?totalRevenue/totalOrders:0);
            document.getElementById('totalCust').textContent=custCount||0;
            document.getElementById('convRate').textContent=(custCount>0?Math.round((totalOrders/custCount)*100):0)+'%';
            document.getElementById('bestDay').textContent=labels[Object.values(daily).indexOf(Math.max(...Object.values(daily)))]||'-';
        }
    </script>
</body>
</html>
